# Cópia de segurança diária do banco (Neon) — criptografada antes de sair do runner.
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   NEON_DATABASE_URL  string de conexão do Neon (de preferência um usuário só-leitura)
#   BACKUP_PASSPHRASE  senha longa para criptografar; guarde fora do GitHub (sem ela o backup não abre)
# Diário: guardado 30 dias (artefato). Dia 1º: cópia mensal PERMANENTE como anexo de uma versão (Release) privada do repositório.
# Restaurar:  gpg -d mtsm-AAAA-MM-DD.dump.gpg > mtsm.dump && pg_restore --no-owner -d "<url destino>" mtsm.dump
name: backup-diario
on:
  schedule:
    - cron: "41 6 * * *"   # 03:41 em Brasília, todo dia
  workflow_dispatch:
    inputs:
      mensal:
        description: "Também guardar como cópia mensal permanente"
        type: boolean
        default: false
permissions:
  contents: write   # necessário só para criar a versão com a cópia mensal
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verifica segredos
        env:
          DB: ${{ secrets.NEON_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "::error::Cadastre NEON_DATABASE_URL e BACKUP_PASSPHRASE nos segredos do repositório."; exit 1; fi
      - name: Instala cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Gera e criptografa
        env:
          DB: ${{ secrets.NEON_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          F="mtsm-$(TZ=America/Sao_Paulo date +%F).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges "$DB" -f "$F"
          test -s "$F"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$F.gpg" "$F" 3<<<"$PASS"
          shred -u "$F"
          echo "ARQ=$F.gpg" >> "$GITHUB_ENV"
          ls -l "$F.gpg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQ }}
          path: ${{ env.ARQ }}
          retention-days: 30
          if-no-files-found: error
      - name: Cópia mensal permanente (dia 1º)
        if: ${{ inputs.mensal || (github.event_name == 'schedule' && startsWith(env.ARQ, 'mtsm-') && contains(env.ARQ, '-01.dump')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fechamento-$(TZ=America/Sao_Paulo date -d yesterday +%Y-%m)"   # dia 1º guarda o mês que acabou de fechar
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARQ" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ARQ" --repo "$GITHUB_REPOSITORY" --title "Backup $TAG" --notes "Cópia mensal criptografada (AES-256). Abrir: gpg -d ARQUIVO > mtsm.dump"
          fi
