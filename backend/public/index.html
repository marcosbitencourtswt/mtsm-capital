<!doctype html>
<html lang="pt-BR" data-palette="verde" data-mode="light" data-auth="pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MTSM Capital · NOFINANCE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>
    /* Aplica paleta e tema antes de pintar (evita piscar). */
    try {
      var p = localStorage.getItem("palette") || "verde", m = localStorage.getItem("mode") || "auto";
      var dark = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.palette = p; document.documentElement.dataset.mode = dark ? "dark" : "light";
    } catch (e) {}
  </script>
</head>
<body>
  <section id="login" class="login" aria-labelledby="login-title">
    <form class="login-card" id="login-form" novalidate>
      <div class="login-brand"><svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><path style="fill:var(--primary)" d="M0.00 12.00A12.00 12.00 0 0 1 12.00 0.00H21.00V21.00H0.00ZM27.00 0.00H36.00A12.00 12.00 0 0 1 48.00 12.00V21.00H27.00ZM27.00 27.00H48.00V36.00A12.00 12.00 0 0 1 36.00 48.00H27.00ZM0.00 27.00H21.00V48.00H12.00A12.00 12.00 0 0 1 0.00 36.00Z"/><path style="fill:var(--accent)" d="M24.00 19.50L28.50 24.00L24.00 28.50L19.50 24.00Z"/></svg><div><strong>MTSM</strong><span>Capital · Family Finance</span></div></div>
      <h1 id="login-title">Entrar</h1>
      <div><label for="lg-email">E-mail</label><input id="lg-email" name="email" type="email" autocomplete="username" required></div>
      <div><label for="lg-pw">Senha</label><input id="lg-pw" name="password" type="password" autocomplete="current-password" required></div>
      <p class="login-err" id="login-err" role="alert"></p>
      <button type="submit">Entrar</button>
      <p class="muted">Acesso só da família. Esqueceu a senha? Peça ao administrador para redefinir.</p>
    </form>
    <form class="login-card" id="setup-form" hidden novalidate>
      <h1>Instalar o sistema</h1>
      <p class="muted">Primeiro acesso: crie a conta do administrador. Use o código de instalação (SETUP_TOKEN) que você colocou na Vercel.</p>
      <div><label for="st-token">Código de instalação</label><input id="st-token" name="token" type="password" autocomplete="off" required></div>
      <div><label for="st-name">Seu nome</label><input id="st-name" name="name" required value="Marcos"></div>
      <div><label for="st-email">E-mail</label><input id="st-email" name="email" type="email" autocomplete="username" required></div>
      <div><label for="st-pw">Senha (mín. 10 caracteres)</label><input id="st-pw" name="password" type="password" autocomplete="new-password" required></div>
      <div><label for="st-pw2">Repita a senha</label><input id="st-pw2" name="password2" type="password" autocomplete="new-password" required></div>
      <p class="login-err" id="setup-err" role="alert"></p>
      <button type="submit">Criar administrador</button>
    </form>
  </section>
  <aside class="side" id="side" aria-label="Menu">
    <div class="brand"><svg viewBox="0 0 320 48" height="30" role="img" aria-label="MTSM Capital"><path style="fill:var(--side-on)" d="M0.00 12.00A12.00 12.00 0 0 1 12.00 0.00H21.00V21.00H0.00ZM27.00 0.00H36.00A12.00 12.00 0 0 1 48.00 12.00V21.00H27.00ZM27.00 27.00H48.00V36.00A12.00 12.00 0 0 1 36.00 48.00H27.00ZM0.00 27.00H21.00V48.00H12.00A12.00 12.00 0 0 1 0.00 36.00Z"/><path style="fill:var(--accent)" d="M24.00 19.50L28.50 24.00L24.00 28.50L19.50 24.00Z"/><polygon style="fill:var(--side-on)" points="66.00,40.00 66.00,8.00 72.40,8.00 78.80,19.20 85.20,8.00 91.60,8.00 91.60,40.00 86.00,40.00 86.00,18.40 80.88,27.20 76.72,27.20 71.60,18.40 71.60,40.00"/><rect style="fill:var(--side-on)" x="96.40" y="8.00" width="22.40" height="5.60"/><rect style="fill:var(--side-on)" x="104.80" y="8.00" width="5.60" height="32.00"/><path style="fill:none;stroke:var(--side-on)" stroke-width="5.60" d="M142.80 10.80H133.00A6.60 6.60 0 0 0 133.00 24.00H133.40A6.60 6.60 0 0 1 133.40 37.20H123.60"/><polygon style="fill:var(--side-on)" points="147.60,40.00 147.60,8.00 154.00,8.00 160.40,19.20 166.80,8.00 173.20,8.00 173.20,40.00 167.60,40.00 167.60,18.40 162.48,27.20 158.32,27.20 153.20,18.40 153.20,40.00"/><rect x="189.2" y="8" width="1" height="32" style="fill:var(--accent)"/><text x="204" y="21" style="fill:var(--side-ink);font:600 9.5px var(--font-display);letter-spacing:2.4px">CAPITAL</text><text x="204" y="37" style="fill:var(--side-ink);font:600 9.5px var(--font-display);letter-spacing:2.4px">FAMILY FINANCE</text></svg></div>
    <select id="entity" aria-label="Entidade">
      <option value="personal">Pessoal</option>
      <option value="byte4tech">Byte4Tech (PJ)</option>
    </select>
    <nav id="tabs">
      <button data-tab="painel"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Painel</button>
      <button data-tab="combinados"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Combinados</button>
      <button data-tab="ranking"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Ranking</button>
      <button data-tab="bancos"><svg viewBox="0 0 24 24"><path d="M3 10 12 4l9 6"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg>Bancos e dívidas</button>
      <button data-tab="pagar"><svg viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6"/></svg>Contas a pagar</button>
      <button data-tab="receber"><svg viewBox="0 0 24 24"><path d="M12 20V6M6 12l6-6 6 6"/></svg>Contas a receber</button>
      <button data-tab="pessoas"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 2 5 5.4"/></svg>Pessoas da casa</button>
      <button data-tab="extrato"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>Extrato</button>
      <button data-tab="futuro"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>Futuro</button>
      <button data-tab="admin" id="tab-admin" hidden><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.2 8 9 4.6-.8 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Administração</button>
      <button data-tab="config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Ajustes</button>
    </nav>
    <div class="me" id="me"></div>
    <div class="side-foot">Family Finance · Wealth &amp; Legacy</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="top">
      <button class="ghost menu-btn" id="menu-btn" aria-label="Abrir menu">☰</button>
      <strong id="page-title">Painel</strong>
      <div class="look" role="group" aria-label="Aparência">
        <div class="palettes" role="radiogroup" aria-label="Paleta">
          <button role="radio" data-palette="verde" title="Verde Institucional" aria-label="Paleta Verde Institucional"><i></i></button>
          <button role="radio" data-palette="meianoite" title="Meia-noite e Latão" aria-label="Paleta Meia-noite e Latão"><i></i></button>
          <button role="radio" data-palette="grafite" title="Grafite e Sálvia" aria-label="Paleta Grafite e Sálvia"><i></i></button>
        </div>
        <select id="mode" aria-label="Tema">
          <option value="auto">Auto</option><option value="light">Claro</option><option value="dark">Escuro</option>
        </select>
      </div>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
  <dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
